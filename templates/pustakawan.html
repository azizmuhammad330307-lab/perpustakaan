<!-- templates/pustakawan.html -->
{% extends "base.html" %}
{% block content %}
<div class="space-y-8">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-slate-800">🛠️ Panel Kelola Pustakawan</h2>
    </div>

    <!-- Form Tambah Buku -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-xl">
        <h3 class="font-bold text-lg text-emerald-800 mb-4">Tambah Buku Baru</h3>
        <form action="/tambah_buku" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Judul Buku</label>
                <input type="text" name="judul" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Penulis</label>
                <input type="text" name="penulis" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Stok</label>
                <input type="number" name="stok" min="1" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transition text-sm">Simpan Buku</button>
        </form>
    </div>

    <!-- Daftar Semua Buku untuk Pustakawan -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h3 class="font-bold text-lg text-emerald-800 mb-4">Daftar Inventaris Buku</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                        <th class="p-3">ID</th>
                        <th class="p-3">Judul Buku</th>
                        <th class="p-3">Penulis</th>
                        <th class="p-3">Stok</th>
                        <th class="p-3">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for buku in buku_list %}
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="p-3">{{ buku.id }}</td>
                        <td class="p-3 font-medium text-slate-800">{{ buku.judul }}</td>
                        <td class="p-3 text-slate-600">{{ buku.penulis }}</td>
                        <td class="p-3">{{ buku.stok }}</td>
                        <td class="p-3">
                            <a href="/hapus_buku/{{ buku.id }}" class="text-rose-600 hover:text-rose-800 font-semibold text-xs bg-rose-50 px-2.5 py-1 rounded border border-rose-200 transition">Hapus</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="p-4 text-center text-slate-500">Belum ada data buku.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<!--{% endblock %}-->
